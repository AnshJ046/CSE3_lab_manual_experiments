<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student registration</title>
</head>
<body>
    <h1 align="center">STUDENT REGISTRATION FORM</h1>
    <hr>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br><br>
        <label for="pass">Password</label>
        <input type="password" id="pass" name="pass" placeholder="Enter your password" required>
        <br><br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Female</label>
        <br><br>
        <label for="course">Course:</label>
        <select id="course" name="course" placeholder="Select a course" required>
            <option value="">Select a course</option>
            <option value="btech">B.Tech</option>
            <option value="mtech">M.Tech</option>
            <option value="mba">MBA</option>
            <option value="msc">M.Sc</option>
        </select>
        <br><br>
        <label for="number">Contact Number:</label>
        <input type="tel" id="number" name="number" placeholder="enter your Ph.no." required>
        <br><br>    
        <label for="address">Address:</label>
        <br>
        <textarea id="address" name="address" rows="4" cols="50" required></textarea>
        <br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
        <hr>

    </form>
    <footer align="center">&copy;2026 Students registration portal</footer>
    
</body>
</html>
